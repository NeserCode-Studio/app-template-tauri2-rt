[package]
name = "app-template"
version = "0.1.0"
description = "A Tauri App"
authors = ["nesercode"]
edition = "2021"

[lib]
name = "app_template_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.10", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-opener = "2.5"
tauri-plugin-shell = "2.3"
tauri-plugin-http = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-fs = "2.7.1"
