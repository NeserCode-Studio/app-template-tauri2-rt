[package]
name = "app-template"
version = "0.1.0"
description = "A Tauri App"
authors = ["nesercode"]
edition = "2021"

[lib]
name = "app_template_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.10", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-opener = "2.5"
tauri-plugin-shell = "2.3"
tauri-plugin-http = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-fs = "2.7.1"
encoding_rs = "0.8"
rmcp = { version = "3.6", features = ["server", "transport-streamable-http-server"] }
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.9"
base64 = "0.22"
dashmap = "6"
thiserror = "2"
sha2 = "0.10"
keyring = { version = "3.6.3", default-features = false, features = [
  "apple-native",
  "crypto-rust",
  "sync-secret-service",
  "windows-native",
] }
log = "0.4"
axum = "0.8"
tower = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
tokio-util = "0.7"
